[project]
name = "harness"
version = "0.0.1"
description = "Harness for agent."
readme = "README.md"
authors = [
    { name = "Vincent", email = "explorer-dong@foxmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.30,<2",
    "openai>=1.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.58,<2"]

[project.scripts]
harness = "harness.main:cli"

[dependency-groups]
dev = ["ruff>=0.16", "ty>=0.0.84"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ"]
