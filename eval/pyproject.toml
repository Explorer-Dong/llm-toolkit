[project]
name = "eval"
version = "0.1.0"
description = "Evaluation harness for the LLM benchmarks."
readme = "README.md"
authors = [
    { name = "Vincent", email = "explorer-dong@foxmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.scripts]
aime = "eval.aime:main"
gpqa = "eval.gpqa:main"
gaia = "eval.gaia:main"
browsecomp = "eval.browsecomp:main"
webwalkerqa = "eval.webwalkerqa:main"

[dependency-groups]
dev = [
    "ruff>=0.16",
    "ty>=0.0.84",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# benchmark prompt strings are prose and kept verbatim
"src/eval/*.py" = ["E501"]
