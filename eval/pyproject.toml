[project]
name = "eval"
version = "0.0.1"
description = "Benchmark for agent including rollout and scoring stage."
readme = "README.md"
authors = [
    { name = "Vincent", email = "explorer-dong@foxmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "math-verify[antlr4-13-2]==0.9.0",
    "mcp>=1.30,<2",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
browser = ["playwright>=1.58,<2"]
swe_bench = ["swebench==5.0.2"]
agent_abstain = ["fastmcp==3.4.11"]
webshop_abstain = [
    "beautifulsoup4>=4.12,<5",
    "cleantext==1.1.4",
    "en-core-web-sm",
    "flask>=3.0,<4",
    "gym==0.24.0",
    "numpy>=1.26,<2",
    "pyarrow<24",
    "pyserini==0.44.0",
    "rank-bm25==0.2.2",
    "spacy==3.7.5",
    "thefuzz==0.19.0",
    "torch==2.6.0",
    "transformers==4.44.2",
]

[project.scripts]
rollout = "eval.benchmarks._common.cli:rollout_main"
scoring = "eval.benchmarks._common.cli:scoring_main"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.16",
    "ty>=0.0.84",
    "playwright>=1.58,<2",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/eval/benchmarks/*/data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# benchmark prompt strings are prose and kept verbatim
"src/eval/benchmarks/*/rollout.py" = ["E501"]
"src/eval/benchmarks/*/scoring.py" = ["E501"]

[tool.ty.src]
exclude = ["src/eval/benchmarks/*/data"]
